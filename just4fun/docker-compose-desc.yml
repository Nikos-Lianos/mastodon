services:
  # Εδώ ξεκινά ο ορισμός των services του stack.
  # Σε αυτό το παράδειγμα έχω ένα πολύ απλό web service με nginx,
  # ώστε να μπορέσω να δοκιμάσω replication, scheduling, updates
  # και γενικά τη συμπεριφορά του Docker Swarm στην πράξη.

  web:
    # Ορίζω service με όνομα web.
    # Αυτό είναι το όνομα με το οποίο το service θα εμφανίζεται μέσα στο stack.

    image: nginx:alpine
    # Επιλέγω το image nginx:alpine.
    # Το nginx είναι ένας πολύ απλός και ελαφρύς web server,
    # κατάλληλος για πρώτες δοκιμές.
    # Το alpine variant είναι μικρό σε μέγεθος και ξεκινά γρήγορα.

    ports:
      # Εδώ ορίζω published ports,
      # δηλαδή ποιες πόρτες του host θα προωθούνται στο container.
      #
      # ΠΟΛΥ ΣΗΜΑΝΤΙΚΟ:
      # Πριν επιλέξω port, πρέπει πρώτα να ελέγξω αν χρησιμοποιείται ήδη,
      #
      # Άρα πριν το deploy, ελέγχω πάντα αν η πόρτα είναι ελεύθερη.
      #
      # Αν η πόρτα είναι ήδη πιασμένη,
      # πρέπει να διαλέξω άλλη ελεύθερη πόρτα.

      - "8080:80"
      # Αυτό σημαίνει:
      # - θύρα 8080 στον host
      # - προώθηση στη θύρα 80 μέσα στο container
      #
      # Άρα όταν ανοίγω στον browser:
      # http://HOST_IP:8080
      # στην πράξη συνδέομαι στο nginx που ακούει στη θύρα 80 του container.

    restart: unless-stopped
    # Αυτή είναι γενική πολιτική restart.
    # Δηλώνω ότι το container θα προσπαθεί να ξανασηκωθεί αυτόματα,
    # εκτός αν το σταματήσω εγώ ρητά.

    networks:
      # Εδώ δηλώνω σε ποιο δίκτυο θα συνδεθεί το service.

      - web-net
      # Συνδέω το web service στο overlay δίκτυο web-net.
      # Έτσι, αν αργότερα προσθέσω και άλλα services στο ίδιο stack,
      # θα μπορούν να επικοινωνούν μεταξύ τους μέσα από αυτό το δίκτυο.

    deploy:
      # Εδώ ξεκινούν οι ρυθμίσεις που αφορούν Docker Swarm deployment.
      # Αυτές οι επιλογές χρησιμοποιούνται όταν κάνω:
      # docker stack deploy
      # και όχι σε απλό docker compose up.

      mode: replicated
      # Δηλώνω ότι το service θα τρέχει σε replicated mode.
      # Δηλαδή δεν θέλω "ένα task ανά node" όπως στο global mode,
      # αλλά συγκεκριμένο αριθμό αντιγράφων του service.

      endpoint_mode: vip
      # Δηλώνω ότι το service θα εκτίθεται μέσω virtual IP.
      # Το Swarm δημιουργεί ένα ενιαίο service endpoint
      # και μοιράζει την κίνηση προς τα διαθέσιμα replicas.

      replicas: 3
      # Θέλω να τρέχουν 3 αντίγραφα του service.
      #
      # Αυτό είναι το βασικό σημείο της άσκησης:
      # να δω στην πράξη πώς το Swarm μοιράζει replicas σε nodes.
      #
      # Αν αλλάξω αυτόν τον αριθμό,
      # μπορώ να κάνω scale up ή scale down το service.

      resources:
        # Εδώ ορίζω περιορισμούς και δεσμεύσεις πόρων.

        limits:
          # Τα limits είναι τα ανώτατα όρια που επιτρέπω στο service.

          cpus: '0.50'
          # Κάθε replica μπορεί να χρησιμοποιήσει έως μισό CPU.

          memory: 500M
          # Κάθε replica μπορεί να χρησιμοποιήσει έως 500 MB RAM.

        reservations:
          # Τα reservations είναι οι ελάχιστοι πόροι
          # που θέλω να εξασφαλίζει ο scheduler πριν τοποθετήσει το task.

          cpus: '0.25'
          # Ζητώ να υπάρχει διαθέσιμο τουλάχιστον το ένα τέταρτο ενός CPU.

          memory: 200M
          # Ζητώ να υπάρχει διαθέσιμη τουλάχιστον μνήμη 200 MB.

      restart_policy:
        # Εδώ ορίζω τη restart policy σε επίπεδο Swarm service.

        condition: on-failure
        # Το task θα γίνεται restart μόνο αν αποτύχει.
        # Δηλαδή όχι απλά επειδή τερμάτισε "κανονικά",
        # αλλά επειδή υπήρξε failure.

        delay: 5s
        # Περιμένω 5 δευτερόλεπτα πριν γίνει νέα προσπάθεια restart.

        window: 120s
        # Ορίζω χρονικό παράθυρο 120 δευτερολέπτων
        # για την αξιολόγηση των failures/restarts.

      update_config:
        # Εδώ ορίζω τη στρατηγική update του service.

        parallelism: 2
        # Επιτρέπω στο Swarm να ενημερώνει έως 2 tasks ταυτόχρονα.
        #
        # Αφού έχω 3 replicas,
        # το update μπορεί να γίνει σε batches
        # και να μην αλλάζουν όλα μαζί την ίδια στιγμή.

        delay: 10s
        # Περιμένω 10 δευτερόλεπτα ανάμεσα στα update batches.

        order: stop-first
        # Πρώτα σταματώ το παλιό task και μετά ξεκινώ το νέο.
        #
        # Αυτή είναι απλή και κατανοητή στρατηγική,
        # αν και μπορεί να προκαλέσει μικρό προσωρινό κενό χωρητικότητας.

        failure_action: rollback
        # Αν το update αποτύχει,
        # ζητώ από το Swarm να επιστρέψει στην προηγούμενη έκδοση/κατάσταση.

      placement:
        # Εδώ ορίζω κανόνες τοποθέτησης των replicas.

        max_replicas_per_node: 1
        # Δηλώνω ότι δεν θέλω πάνω από ένα replica αυτού του service
        # στο ίδιο node.
        #
        # Αυτό είναι πολύ χρήσιμο για δοκιμές υψηλής διαθεσιμότητας,
        # γιατί αναγκάζει το Swarm να μοιράσει τα replicas σε διαφορετικά machines,
        # εφόσον αυτά υπάρχουν διαθέσιμα.

        constraints:
          # Η λίστα των περιορισμών scheduling.

          - node.role == worker
          # Θέλω το service να τρέχει μόνο σε worker nodes
          # και όχι σε manager nodes.
          #
          # ώστε οι managers να μένουν "καθαροί"
          # για orchestration και control plane λειτουργίες.

networks:
  # Εδώ ξεκινά ο ορισμός των δικτύων του stack.

  web-net:
    # Ορίζω δίκτυο με όνομα web-net.

    driver: overlay
    # Χρησιμοποιώ overlay network,
    # δηλαδή δίκτυο κατάλληλο για Docker Swarm,
    # ώστε services που βρίσκονται σε διαφορετικά nodes
    # να μπορούν να επικοινωνούν μεταξύ τους σαν να ήταν στο ίδιο ιδιωτικό δίκτυο.

    attachable: true
    # Με το attachable: true επιτρέπω,
    # αν χρειαστεί αργότερα,
    # και σε άλλα standalone containers να συνδεθούν σε αυτό το δίκτυο.
